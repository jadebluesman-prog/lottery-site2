name: Update lottery results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrape_and_update.py"
      - ".github/workflows/scrape.yml"
  schedule:
    # ทุก 10 นาที ระหว่าง 17:30–20:50 น. เวลาไทย (GitHub ใช้เวลา UTC)
    - cron: "30,40,50 10 * * *"
    - cron: "*/10 11-12 * * *"
    - cron: "0,10,20,30,40,50 13 * * *"

permissions:
  contents: write

concurrency:
  group: lottery-scraper
  cancel-in-progress: false

jobs:
  scrape:
    # ใช้คอม Windows ของเจ้าของ repository แทนเครื่องของ GitHub
    # เพราะเว็บต้นทางบล็อก IP ของ GitHub Actions
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Python
        shell: cmd
        run: python --version

      - name: Install Playwright
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Scrape current results
        shell: cmd
        run: python scrape_and_update.py

      - name: Save results to GitHub
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const fs = require("fs");
            const path = "results.json";
            const branch = context.ref.replace("refs/heads/", "");
            const localContent = fs.readFileSync(path, "utf8");

            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch
            });

            const remoteContent = Buffer.from(
              current.data.content,
              "base64"
            ).toString("utf8");

            if (localContent === remoteContent) {
              core.info("No data changes");
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: "chore: update lottery results",
              content: Buffer.from(localContent).toString("base64"),
              sha: current.data.sha
            });

            core.info("results.json updated successfully");
