name: Update lottery results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrape_and_update.py"
      - ".github/workflows/scrape.yml"
  schedule:
    # ทุก 10 นาที ระหว่าง 17:30–20:50 น. เวลาไทย (GitHub ใช้เวลา UTC)
    - cron: "30,40,50 10 * * *"
    - cron: "*/10 11-12 * * *"
    - cron: "0,10,20,30,40,50 13 * * *"

permissions:
  contents: write

concurrency:
  group: lottery-scraper
  cancel-in-progress: false

jobs:
  scrape:
    # ใช้คอม Windows ของเจ้าของ repository แทนเครื่องของ GitHub
    # เพราะเว็บต้นทางบล็อก IP ของ GitHub Actions
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Python
        shell: cmd
        run: python --version

      - name: Install Playwright
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Scrape current results
        shell: cmd
        run: python scrape_and_update.py

      - name: Save results to GitHub
        if: always()
        shell: cmd
        run: |
          git config user.name "lottery-results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --cached --quiet
          if not errorlevel 1 (
            echo No data changes
            exit /b 0
          )
          git commit -m "chore: update lottery results"
          git pull --rebase origin %GITHUB_REF_NAME%
          git push origin HEAD:%GITHUB_REF_NAME%
