<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ผลหวยวันนี้</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap');
  * { box-sizing: border-box; }
  :root {
    color-scheme: dark;
    --bg: #0E1A1B; --panel: #16282A; --panel-soft: #1B3032;
    --text: #F1EDE2; --muted: #93A5A0; --quiet: #6E827D;
    --border: rgba(255,255,255,0.08); --tile-top: #1E3335;
    --tile-bottom: #152425; --tile-text: #E8B84B; --shadow: rgba(0,0,0,0.28);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F3F0E8; --panel: #FFFFFF; --panel-soft: #F7F5EF;
    --text: #183032; --muted: #4F6864; --quiet: #6B7D79;
    --border: rgba(14,42,44,0.12); --tile-top: #FFF8E6;
    --tile-bottom: #F4E9C9; --tile-text: #9A6510; --shadow: rgba(25,55,52,0.10);
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans Thai', sans-serif;
    padding: 28px 18px 60px;
    transition: background .25s ease, color .25s ease;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-family: 'Noto Serif Thai', serif; font-size: clamp(30px, 5vw, 42px); line-height: 1.1; margin: 0; letter-spacing: -.02em; }
  .sub { color: var(--quiet); font-size: 13px; margin: 4px 0 0; }
  .updated { color: var(--quiet); font-size: 12px; text-align: right; line-height: 1.25; }
  .updated-label { display: block; font-size: 12px; font-weight: 500; }
  .updated-value { display: flex; align-items: baseline; justify-content: flex-end; gap: 7px; margin-top: 2px; font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
  .updated-date { color: var(--text); font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
  .updated-time { color: var(--quiet); font-size: 12px; font-weight: 500; }
  .updated.error { color: #E8B84B; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; gap: 8px; }
  .header-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .theme-toggle { appearance: none; display: inline-grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 50%; padding: 0; cursor: pointer; font-size: 19px; line-height: 1; box-shadow: 0 5px 18px var(--shadow); }
  .theme-toggle:hover { transform: translateY(-1px); }
  .theme-toggle:focus-visible { outline: 3px solid rgba(232,184,75,.35); outline-offset: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 28px var(--shadow); }
  .cards { display: grid; gap: 14px; margin-bottom: 28px; }
  .card { position: relative; overflow: hidden; padding: 20px 22px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
  .card::after { content: ""; position: absolute; inset: auto -60px -80px auto; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(232,184,75,.08), transparent 68%); pointer-events: none; }
  .tag { display: inline-flex; align-items: center; justify-content: center; min-width: 52px; font: 800 15px 'IBM Plex Mono', monospace; letter-spacing: .08em; padding: 7px 12px; border-radius: 9px; box-shadow: 0 6px 18px var(--shadow); }
  .result-heading { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .result-date { color: var(--muted); font-size: 12px; font-weight: 600; }
  .name { font-weight: 700; font-size: 18px; margin-top: 9px; }
  .schedule { color: var(--quiet); font-size: 12px; margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-top: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  .dot-waiting, .tile.waiting { animation: pulse 1.6s ease-in-out infinite; }
  .tiles { display: flex; gap: 7px; }
  .tile-group { display: flex; gap: 5px; }
  .tile {
    width: 44px; height: 58px; border-radius: 9px;
    background: linear-gradient(180deg,var(--tile-top),var(--tile-bottom));
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 28px; color: var(--tile-text);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.30), 0 7px 20px var(--shadow);
  }
  .tile.small { width: 30px; height: 40px; font-size: 17px; }
  .tile.waiting { color: #5D6E6A; }
  .action-group { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .main-result { display: flex; flex-direction: column; align-items: flex-end; }
  .prize-breakdown { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--border); width: 100%; }
  .prize { min-width: 82px; padding: 8px 10px; border-radius: 10px; background: var(--panel-soft); border: 1px solid var(--border); text-align: center; }
  .prize-label { display: block; color: var(--quiet); font-size: 10px; margin-bottom: 2px; }
  .prize-number { color: var(--text); font: 700 18px 'IBM Plex Mono', monospace; letter-spacing: .08em; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { cursor: pointer; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .tab.active { color: #0E1A1B; }
  .history-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 2px 0 16px; padding: 4px 2px 12px; border-bottom: 1px solid var(--border); }
  .history-title { position: relative; display: flex; align-items: center; gap: 10px; color: var(--text); font-family: 'Noto Serif Thai', serif; font-weight: 700; font-size: 23px; line-height: 1.25; }
  .history-title::before { content: ""; display: block; width: 5px; height: 27px; border-radius: 999px; background: linear-gradient(180deg, #E8B84B, #C0463A); box-shadow: 0 4px 14px rgba(232,184,75,.25); }
  .month-select { appearance: none; min-width: 150px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 32px 8px 11px; background: var(--panel-soft); color: var(--text); font: 500 12px 'IBM Plex Sans Thai', sans-serif; cursor: pointer; }
  .table-wrap { overflow-x: auto; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--quiet); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-family: 'IBM Plex Mono', monospace; }
  td.status-cell { font-family: 'IBM Plex Sans Thai', sans-serif; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .empty { color: var(--quiet); font-size: 13px; padding: 20px 4px; }
  @media (max-width: 620px) {
    body { padding: 20px 12px 42px; }
    .card { align-items: stretch; }
    .action-group, .main-result { align-items: flex-start; width: 100%; }
    .prize-breakdown { justify-content: flex-start; }
    .card { padding: 18px 16px; }
    .tile { width: 38px; height: 52px; font-size: 24px; }
    .header-actions { justify-content: space-between; width: 100%; }
    .history-toolbar { align-items: stretch; flex-direction: column; }
    .month-select { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <h1>ผลหวยวันนี้</h1>
      <p class="sub">ผลหวยไทย ผลหวยลาว ผลหวยฮานอย</p>
    </div>
    <div class="header-actions">
      <div class="updated" id="updated-at">กำลังโหลด…</div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="เปลี่ยนเป็นธีมสว่าง" title="เปลี่ยนธีม">☀</button>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="panel" style="padding:18px;">
    <div class="tabs" id="tabs"></div>
    <div id="history"></div>
  </div>
</div>

<script>
const LOTTERY_TYPES = [
  { id: "lao", label: "หวยลาวพัฒนา", tag: "ลาว", schedule: "จันทร์–ศุกร์ 20:30 น.", hour: 20, minute: 30, days: [1,2,3,4,5], accent: "#4C8B67" },
  { id: "hanoi_special", label: "ฮานอยพิเศษ", tag: "VN", schedule: "ทุกวัน 17:30 น.", hour: 17, minute: 30, days: [0,1,2,3,4,5,6], accent: "#C0463A" },
  { id: "hanoi_normal", label: "ฮานอยปกติ", tag: "VN", schedule: "ทุกวัน 18:30 น.", hour: 18, minute: 30, days: [0,1,2,3,4,5,6], accent: "#C0463A" },
  { id: "hanoi_vip", label: "ฮานอย VIP", tag: "VN", schedule: "ทุกวัน 19:30 น.", hour: 19, minute: 30, days: [0,1,2,3,4,5,6], accent: "#C0463A" },
];

let DATA = { lao: [], hanoi_special: [], hanoi_normal: [], hanoi_vip: [] };
let activeTab = "lao";
let activeMonth = "all";

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const button = document.getElementById("theme-toggle");
  const isLight = theme === "light";
  button.textContent = isLight ? "☾" : "☀";
  button.setAttribute("aria-label", isLight ? "เปลี่ยนเป็นธีมมืด" : "เปลี่ยนเป็นธีมสว่าง");
  button.setAttribute("aria-pressed", String(isLight));
}

const savedTheme = localStorage.getItem("lottery-theme");
const preferredTheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
applyTheme(savedTheme || preferredTheme);

document.getElementById("theme-toggle").addEventListener("click", () => {
  const nextTheme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  localStorage.setItem("lottery-theme", nextTheme);
  applyTheme(nextTheme);
});

function sortDesc(list) {
  return [...list].sort((a, b) => (a.date + (a.time||"") < b.date + (b.time||"") ? 1 : -1));
}

function latestOf(id) {
  const list = sortDesc(DATA[id] || []);
  return list[0];
}

function tile(char, small, waiting) {
  return `<div class="tile ${small ? "small" : ""} ${waiting ? "waiting" : ""}">${waiting ? "–" : (char || "–")}</div>`;
}

function prize(label, value, waiting) {
  return `<div class="prize">
    <span class="prize-label">${label}</span>
    <span class="prize-number">${waiting ? "–" : (value || "–")}</span>
  </div>`;
}

function bangkokDateParts(date = new Date()) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Bangkok",
    year: "numeric", month: "numeric", day: "numeric",
    hour: "numeric", minute: "numeric", second: "numeric",
    hourCycle: "h23"
  }).formatToParts(date);
  return Object.fromEntries(parts.filter(part => part.type !== "literal").map(part => [part.type, Number(part.value)]));
}

function isoFromParts(parts) {
  return `${parts.year}-${String(parts.month).padStart(2, "0")}-${String(parts.day).padStart(2, "0")}`;
}

function drawForOffset(type, offset, nowParts) {
  const calendarDate = new Date(Date.UTC(nowParts.year, nowParts.month - 1, nowParts.day + offset));
  const dayOfWeek = calendarDate.getUTCDay();
  if (!type.days.includes(dayOfWeek)) return null;
  const year = calendarDate.getUTCFullYear();
  const month = calendarDate.getUTCMonth() + 1;
  const day = calendarDate.getUTCDate();
  return {
    iso: `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`,
    timestamp: Date.UTC(year, month - 1, day, type.hour - 7, type.minute, 0)
  };
}

function formatThaiShortDate(isoDate) {
  if (!isoDate) return "ยังไม่มีวันที่";
  const [year, month, day] = isoDate.split("-").map(Number);
  const weekday = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."][
    new Date(Date.UTC(year, month - 1, day)).getUTCDay()
  ];
  const buddhistYear = String(year + 543).slice(-2);
  return `${weekday} ${day}/${month}/${buddhistYear}`;
}

function formatCountdown(milliseconds) {
  const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
  const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
  const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
  const seconds = String(totalSeconds % 60).padStart(2, "0");
  return `${hours}:${minutes}:${seconds}`;
}

function cardState(type, latest) {
  const now = new Date();
  const nowParts = bangkokDateParts(now);
  const todayIso = isoFromParts(nowParts);
  const todayDraw = drawForOffset(type, 0, nowParts);
  const latestDate = latest && latest.date ? String(latest.date) : "";
  const pendingUpdate = todayDraw && Date.now() >= todayDraw.timestamp && latestDate !== todayIso;

  let nextDraw = null;
  for (let offset = 0; offset <= 8; offset += 1) {
    const candidate = drawForOffset(type, offset, nowParts);
    if (candidate && candidate.timestamp > Date.now()) {
      nextDraw = candidate;
      break;
    }
  }

  const withinCountdown = nextDraw && nextDraw.timestamp - Date.now() <= 5 * 60 * 60 * 1000;
  if (pendingUpdate) {
    return { waiting: true, date: todayIso, text: "กำลังอัปเดตผล" };
  }
  if (withinCountdown) {
    return {
      waiting: true,
      date: nextDraw.iso,
      text: `รอออกผล ${formatCountdown(nextDraw.timestamp - Date.now())}`
    };
  }
  if (!latest) {
    return { waiting: true, date: nextDraw ? nextDraw.iso : todayIso, text: "รอผล" };
  }
  return { waiting: latest.status === "waiting", date: latestDate, text: latest.status === "waiting" ? "รอผล" : "ออกผลแล้ว" };
}

function renderCards() {
  const el = document.getElementById("cards");
  el.innerHTML = LOTTERY_TYPES.map(t => {
    const latest = latestOf(t.id);
    const state = cardState(t, latest);
    const isWaiting = state.waiting;
    const mainStr = latest && latest.main ? String(latest.main) : "";
    let mainTiles;
    if (t.id === "lao") {
      mainTiles = `<div class="tiles">${Array.from({length:6}).map((_,i)=>tile(mainStr[i], false, isWaiting)).join("")}</div>`;
    } else {
      mainTiles = `<div class="tiles">${Array.from({length:5}).map((_,i)=>tile(mainStr[i], false, isWaiting)).join("")}</div>`;
    }
    const top3 = latest && latest.top3 ? String(latest.top3).padStart(3, "0") : mainStr.slice(-3);
    const top2 = mainStr.slice(-2);
    const bottom2 = latest && latest.bottom2 ? String(latest.bottom2).padStart(2, "0") : "";
    const breakdown = t.id === "lao"
      ? prize("3 ตัวบน", top3, isWaiting) + prize("2 ตัวบน", top2, isWaiting) + prize("2 ตัวล่าง", bottom2, isWaiting)
      : prize("3 ตัวบน", top3, isWaiting) + prize("2 ตัวล่าง", bottom2, isWaiting);
    return `
    <div class="panel card" style="border-left:4px solid ${t.accent}">
      <div style="min-width:160px;">
        <div class="result-heading">
          <span class="tag" style="background:${t.accent};color:#fff">${t.tag}</span>
          <span class="result-date">ผลของวันที่ ${formatThaiShortDate(state.date)}</span>
        </div>
        <div class="name">${t.label}</div>
        <div class="schedule">${t.schedule}</div>
        <div class="badge" style="background:${isWaiting ? 'rgba(232,184,75,0.15)' : 'rgba(76,139,103,0.18)'};color:${isWaiting ? '#E8B84B' : '#7ED2A0'}">
          <span class="dot ${isWaiting ? 'dot-waiting' : ''}" style="background:${isWaiting ? '#E8B84B' : '#7ED2A0'}"></span>
          ${state.text}
        </div>
      </div>
      <div class="action-group">
        <div class="main-result">
          ${mainTiles}
        </div>
        <div class="prize-breakdown">${breakdown}</div>
      </div>
    </div>`;
  }).join("");
}

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = LOTTERY_TYPES.map(t => `
    <div class="tab ${activeTab === t.id ? 'active' : ''}" style="${activeTab === t.id ? `background:${t.accent}` : ''}" data-id="${t.id}">${t.label}</div>
  `).join("");
  el.querySelectorAll(".tab").forEach(elm => {
    elm.addEventListener("click", () => { activeTab = elm.dataset.id; activeMonth = "all"; renderTabs(); renderHistory(); });
  });
}

function renderHistory() {
  const list = sortDesc(DATA[activeTab] || []);
  const el = document.getElementById("history");
  if (list.length === 0) {
    el.innerHTML = `<div class="empty">ยังไม่มีประวัติของประเภทนี้</div>`;
    return;
  }
  const months = [...new Set(list.map(e => String(e.date).slice(0, 7)))];
  if (activeMonth !== "all" && !months.includes(activeMonth)) activeMonth = "all";
  const filteredList = activeMonth === "all"
    ? list
    : list.filter(e => String(e.date).startsWith(activeMonth));
  const monthLabel = month => new Intl.DateTimeFormat("th-TH", {
    month: "long",
    year: "numeric"
  }).format(new Date(`${month}-01T12:00:00`));
  const monthOptions = [
    `<option value="all">ทุกเดือน (${list.length} งวด)</option>`,
    ...months.map(month => {
      const count = list.filter(e => String(e.date).startsWith(month)).length;
      return `<option value="${month}" ${activeMonth === month ? "selected" : ""}>${monthLabel(month)} (${count})</option>`;
    })
  ].join("");
  const isLao = activeTab === "lao";
  const rows = filteredList.map(e => `
    <tr>
      <td>${formatThaiShortDate(e.date)}</td>
      <td>${e.main || "-"}</td>
      <td>${e.top3 || "-"}</td>
      ${isLao ? `<td>${e.main ? String(e.main).slice(-2) : "-"}</td>` : ""}
      <td>${e.bottom2 || "-"}</td>
      <td class="status-cell">${e.status === "waiting" ? "รอผล" : "ออกแล้ว"}</td>
    </tr>`).join("");
  el.innerHTML = `
    <div class="history-toolbar">
      <div class="history-title">ประวัติผลรางวัล</div>
      <select class="month-select" id="month-select" aria-label="เลือกเดือน">${monthOptions}</select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>วันที่</th><th>เลขหลัก</th><th>3 ตัวบน</th>${isLao ? "<th>2 ตัวบน</th>" : ""}<th>2 ตัวล่าง</th><th>สถานะ</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  document.getElementById("month-select").addEventListener("change", event => {
    activeMonth = event.target.value;
    renderHistory();
  });
}

async function loadData() {
  try {
    const res = await fetch("./results.json?_=" + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA = await res.json();
    const updatedEl = document.getElementById("updated-at");
    const lastRun = DATA._meta && DATA._meta.last_run;
    if (lastRun) {
      const updatedDate = new Date(lastRun);
      const dateText = updatedDate.toLocaleDateString("th-TH", {
        day: "numeric", month: "numeric", year: "numeric"
      });
      const timeText = updatedDate.toLocaleTimeString("th-TH", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      });
      updatedEl.innerHTML = `
        <span class="updated-label">อัปเดตระบบล่าสุด</span>
        <span class="updated-value">
          <span class="updated-date">${dateText}</span>
          <span class="updated-time">${timeText}</span>
        </span>`;
      updatedEl.classList.remove("error");
    } else {
      updatedEl.textContent = "ยังไม่เคยดึงข้อมูลสำเร็จ";
      updatedEl.classList.add("error");
    }
  } catch (e) {
    const updatedEl = document.getElementById("updated-at");
    updatedEl.textContent = "โหลดข้อมูลไม่สำเร็จ กรุณาลองใหม่";
    updatedEl.classList.add("error");
  }
  renderCards();
  renderTabs();
  renderHistory();
}

loadData();
// อัปเดตเวลานับถอยหลังบนการ์ดทุกวินาที
setInterval(renderCards, 1000);
// รีโหลดข้อมูลทุก 5 นาที เผื่อมีการอัปเดตใหม่ระหว่างที่เปิดหน้าเว็บค้างไว้
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
